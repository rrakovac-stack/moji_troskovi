
name: Izrada Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/izradi-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Postavi Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pripremi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Raspakiraj Android projekt
        run: |
          mkdir -p project
          unzip -q ./*.zip -d project
          find project -name settings.gradle.kts

      - name: Izradi APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: MojiTroskovi-APK
          path: project/**/build/outputs/apk/debug/*.apk

